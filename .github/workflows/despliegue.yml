name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - produccion

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build And Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_FLOWER_0C389AB10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Configuración Directa Certificada ######
          app_location: "/" 
          api_location: "" 
          output_location: "/" 
          skip_app_build: true # Evita que Azure intente compilar y falle con el CSS
          ###### Fin de la Configuración ######
